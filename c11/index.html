<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tarjeta C11</title>
<!-- ▼▼ PARA ACTIVAR ESTA TARJETA, PEGA EL ENLACE ENTRE LAS COMILLAS ▼▼ -->
<script>var DESTINO = "";</script>
<!-- ▲▲ Ejemplo: var DESTINO = "https://www.instagram.com/cliente"; ▲▲ -->
<script>if (DESTINO) location.replace(DESTINO);</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif;
    background: #f4f5f7; color: #1e2a38; text-align: center; padding: 16px; box-sizing: border-box; }
  .box { max-width: 340px; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p { margin: 0; color: #5b6573; }
  .code { display: inline-block; margin-top: 14px; padding: 4px 10px; border-radius: 6px; background: #1e2a38; color: #f5b841; font-weight: 700; letter-spacing: .08em; }
  a { color: #1e2a38; font-weight: 600; }
</style>
</head>
<body>
  <div class="box" id="off">
    <h1>Esta tarjeta aún no está activada</h1>
    <p>Pronto te llevará a la página del local. Vuelve a escanearla más tarde.</p>
    <span class="code">C11</span>
  </div>
  <p id="on" hidden>Abriendo…<br><a id="link" href="#">Toca aquí si no se abre</a></p>
  <script>
    if (DESTINO) {
      document.getElementById("off").hidden = true;
      document.getElementById("on").hidden = false;
      document.getElementById("link").href = DESTINO;
    }
  </script>
</body>
</html>
